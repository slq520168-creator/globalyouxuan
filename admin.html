<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlobalYouXuan 后台</title>
<link rel="stylesheet" href="style.css">
<style>
.admin{padding:80px 16px 40px;max-width:720px;margin:0 auto}
.panel{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card);margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 12px;font-size:18px}
.panel input,.panel textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:6px 0}
.panel button{padding:11px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;font-weight:700;cursor:pointer;margin-right:8px;margin-top:8px}
.tip{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 12px}
.out{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;word-break:break-all;margin-top:10px;display:none}
.row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">GY</span>
    <span class="brand-text"><b>后台</b></span>
  </div>
  <a href="index.html" style="color:var(--cyan)">返回网站</a>
</header>

<main class="admin">
  <section class="panel">
    <h2>确认订单（最简单）</h2>
    <p class="tip">从 Telegram 通知里复制订单号和密码，填在下面，点生成。然后把结果复制到 confirmed.json 里保存。</p>
    <input id="cid" placeholder="订单号 例如 GYX18649672">
    <input id="cpwd" placeholder="密码 例如 SJC3FC">
    <button type="button" onclick="makeConfirm()">生成确认内容</button>
    <div class="out" id="out"></div>
  </section>

  <section class="panel">
    <h2>操作说明</h2>
    <p class="tip">
      1. 客户下单后你收到 Telegram 通知<br>
      2. 核对 U 是否到账<br>
      3. 把通知里的订单号、密码填到上面<br>
      4. 点「生成确认内容」<br>
      5. 复制生成的内容，打开仓库 confirmed.json，粘贴保存<br>
      6. 客户即可在查询页输入订单号看到密码
    </p>
  </section>

  <section class="panel">
    <h2>快捷链接</h2>
    <p class="tip">
      <a href="order.html" style="color:var(--blue)">订单页</a> ·
      <a href="query.html" style="color:var(--blue)">查询密码页</a> ·
      <a href="https://github.com/slq520168-creator/globalyouxuan/blob/main/confirmed.json" style="color:var(--blue)">编辑 confirmed.json</a>
    </p>
  </section>
</main>

<script>
function makeConfirm(){
  const id = document.getElementById('cid').value.trim();
  const pwd = document.getElementById('cpwd').value.trim();
  const out = document.getElementById('out');
  if(!id || !pwd){
    out.style.display = 'block';
    out.textContent = '请填写订单号和密码';
    return;
  }
  const line = `{"id":"${id}","pwd":"${pwd}"}`;
  out.style.display = 'block';
  out.innerHTML = `把 confirmed.json 改成：<br><br>[${line}]<br><br>如果已有其他订单，就加在数组里：<br>[{之前的}, ${line}]`;
}
</script>
</body>
</html>
