<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalYouXuan 后台</title><link rel="stylesheet" href="assets/style.css"><style>
.admin{padding:90px 0 40px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:1px solid var(--line);border-radius:18px;padding:20px;background:rgba(7,27,63,.72)}.panel h2{margin-top:0}.panel input,.panel textarea,.panel select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:white;margin:6px 0}.panel button{padding:11px 14px;border-radius:10px;border:0;background:white;color:#06152e;font-weight:700}.list{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:12px;padding:12px}.row small{color:var(--muted)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div class="brand">GlobalYouXuan 后台</div><a href="index.html">返回网站</a></div></header><main class="admin"><div class="wrap"><div class="admin-grid">
<section class="panel"><h2>产品管理</h2><form id="productForm"><input name="id" placeholder="产品ID" required><select name="category"><option value="web">网站建设</option><option value="ai">人工智能</option><option value="auto">自动化运营</option><option value="digital">数字化方案</option></select><input name="titleZh" placeholder="中文标题" required><input name="titleEn" placeholder="英文标题"><input name="titleKm" placeholder="柬文标题"><textarea name="descZh" placeholder="中文说明"></textarea><input name="price" type="number" placeholder="USDT价格" required><button>保存产品</button></form><div class="list" id="productList"></div></section>
<section class="panel"><h2>订单与需求</h2><button onclick="exportData()">导出数据</button><h3>订单</h3><div class="list" id="orders"></div><h3>未匹配需求</h3><div class="list" id="demands"></div></section>
</div></div></main><script>
const seed=[{"id": "web-starter", "category": "web", "price": 99, "title": {"zh": "企业展示网站", "en": "Business Showcase Website", "km": "គេហទំព័របង្ហាញអាជីវកម្ម"}, "desc": {"zh": "适合品牌展示、联系方式、业务介绍与移动端访问。", "en": "For brand presentation, contact details, services and mobile access.", "km": "សម្រាប់បង្ហាញម៉ាក ព័ត៌មានទំនាក់ទំនង សេវាកម្ម និងការប្រើប្រាស់លើទូរស័ព្ទ។"}}, {"id": "ai-content", "category": "ai", "price": 49, "title": {"zh": "AI内容解决方案", "en": "AI Content Solution", "km": "ដំណោះស្រាយមាតិកា AI"}, "desc": {"zh": "用于文案、图片提示词、客服回复与内容生产。", "en": "For copywriting, image prompts, customer replies and content production.", "km": "សម្រាប់សរសេរមាតិកា prompt រូបភាព ឆ្លើយតបអតិថិជន និងផលិតមាតិកា។"}}, {"id": "automation-order", "category": "auto", "price": 149, "title": {"zh": "订单自动化方案", "en": "Order Automation Solution", "km": "ដំណោះស្រាយស្វ័យប្រវត្តិកម្មការបញ្ជាទិញ"}, "desc": {"zh": "自动收集需求、发送通知、整理订单与交付信息。", "en": "Collects requests, sends alerts and organises orders and delivery.", "km": "ប្រមូលតម្រូវការ ផ្ញើការជូនដំណឹង និងរៀបចំការបញ្ជាទិញ និងការបញ្ជូន។"}}, {"id": "digital-global", "category": "digital", "price": 129, "title": {"zh": "跨境数字业务方案", "en": "Cross-border Digital Business", "km": "ដំណោះស្រាយអាជីវកម្មឌីជីថលឆ្លងដែន"}, "desc": {"zh": "适合数字产品展示、咨询、下单与自动交付。", "en": "For digital product display, enquiry, ordering and delivery.", "km": "សម្រាប់បង្ហាញផលិតផលឌីជីថល សាកសួរ បញ្ជាទិញ និងបញ្ជូន។"}}];let products=JSON.parse(localStorage.getItem("gyx_products")||JSON.stringify(seed));
function save(){localStorage.setItem("gyx_products",JSON.stringify(products));render()}
function render(){document.getElementById("productList").innerHTML=products.map(p=>`<div class="row"><b>${p.title.zh}</b><br><small>${p.category} · ${p.price} USDT</small><br><button onclick="delP('${p.id}')">删除</button></div>`).join("");const orders=JSON.parse(localStorage.getItem("gyx_orders")||"[]");document.getElementById("orders").innerHTML=orders.length?orders.map(o=>`<div class="row"><b>${o.product||"咨询"}</b><br><small>${o.name||""} · ${o.contact||""}</small><p>${o.need||""}</p></div>`).join(""):"暂无订单";const d=JSON.parse(localStorage.getItem("gyx_demands")||"[]");document.getElementById("demands").innerHTML=d.length?d.map(x=>`<div class="row">${x.q}<br><small>${x.date}</small></div>`).join(""):"暂无记录"}
function delP(id){products=products.filter(p=>p.id!==id);save()}
document.getElementById("productForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const p={id:f.get("id"),category:f.get("category"),price:Number(f.get("price")),title:{zh:f.get("titleZh"),en:f.get("titleEn")||f.get("titleZh"),km:f.get("titleKm")||f.get("titleZh")},desc:{zh:f.get("descZh"),en:f.get("descZh"),km:f.get("descZh")}};products=products.filter(x=>x.id!==p.id);products.push(p);save();e.target.reset()}
function exportData(){const data={products,orders:JSON.parse(localStorage.getItem("gyx_orders")||"[]"),demands:JSON.parse(localStorage.getItem("gyx_demands")||"[]")};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="GlobalYouXuan-data.json";a.click()}
render()
</script></body></html>
