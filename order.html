<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>下单 - GlobalYouXuan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;padding:20px}
.order-page{max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:16px}
.card h1{font-size:22px}
.price{font-size:28px;font-weight:700;color:#667eea;margin:8px 0 20px}
.field{margin-bottom:14px}
.field label{font-size:13px;color:#888;display:block;margin-bottom:4px}
.field input{width:100%;padding:12px;border:1px solid #e0e0e0;border-radius:10px;font-size:15px}
.pay-item{border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px}
.pay-item.active{border-color:#667eea;background:#f8f9ff}
.pay-item h3{font-size:15px}
.pay-item p{font-size:13px;color:#888}
.addr-box{display:flex;gap:8px;margin-top:10px}
.addr-box code{flex:1;font-size:12px;background:#f0f2f7;padding:10px;border-radius:8px;word-break:break-all}
.copy-btn{border:0;background:#667eea;color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn-main{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin-top:8px}
.status-box{text-align:center;padding:24px 16px;display:none}
.order-id{font-size:24px;font-weight:700;color:#667eea;margin:12px 0;letter-spacing:2px}
.note{font-size:12px;color:#888;margin-top:12px}
.back{display:inline-block;margin-bottom:16px;color:#667eea}
.btn-outline{background:transparent;color:#667eea;border:2px solid #667eea;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="order-page">
  <a class="back" href="javascript:history.back()">← 返回</a>

  <div class="card" id="orderForm">
    <h1 id="productName">加载中...</h1>
    <div class="price"><span id="productPrice">--</span> U</div>

    <div class="field">
      <label>联系方式（选填）</label>
      <input id="contact" placeholder="Telegram / 微信 / 邮箱" />
    </div>

    <div class="pay-item active">
      <h3>① U收款（推荐）</h3>
      <p>USDT · TRC20</p>
      <div class="addr-box">
        <code id="usdtAddr">TKfQoN7kZirALGYxMkxU4SoqMWJRqXsh7k</code>
        <button class="copy-btn" onclick="copyAddr()">复制</button>
      </div>
    </div>

    <div class="pay-item">
      <h3>② 支付宝 / 微信</h3>
      <p>联系客服获取收款码</p>
      <a href="tg://resolve?domain=qqyousubot" style="color:#667eea;font-weight:600;">联系客服</a>
    </div>

    <button class="btn-main" onclick="submitPaid()">我已付款，请确认</button>
    <p class="note">先转账再点击，确认后生成订单号</p>
  </div>

  <div class="card status-box" id="resultBox">
    <h2>✅ 订单已提交</h2>
    <p>你的订单号：</p>
    <div class="order-id" id="orderIdShow"></div>
    <p class="note">保存此订单号，联系客服确认到账后即可下载</p>
    <br>
    <a href="index.html" class="btn-outline" style="display:inline-block;text-decoration:none;">返回首页</a>
  </div>
</div>

<script>
// 配置
const BOT_TOKEN = '8835320602:AAGCrOvqcmBcYIFctpTAba3ZcPw3a7GU8aQ';
const CHAT_ID = '6934078288';

const params = new URLSearchParams(location.search);
const PRODUCT = {
  name: params.get('name') || '未指定产品',
  price: params.get('price') || '0U'
};

document.getElementById('productName').textContent = PRODUCT.name;
document.getElementById('productPrice').textContent = PRODUCT.price.replace('U','');

function copyAddr(){
  const addr = document.getElementById('usdtAddr').textContent;
  // 用系统弹窗复制，手机上最稳
  const input = document.createElement('input');
  input.value = addr;
  document.body.appendChild(input);
  input.select();
  try {
    document.execCommand('copy');
    alert('已复制收款地址');
  } catch(e) {
    alert('请长按地址手动复制：\n' + addr);
  }
  document.body.removeChild(input);
}

function genOrderId(){
  const n = Date.now().toString().slice(-6);
  return 'YX' + n;
}

async function submitPaid(){
  const contact = document.getElementById('contact').value.trim();
  const orderId = genOrderId();

  // 显示订单号
  document.getElementById('orderForm').style.display = 'none';
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('orderIdShow').textContent = orderId;

  // 发送通知到 Telegram
  try {
    const msg = encodeURIComponent(`🛒 新订单
订单号: ${orderId}
产品: ${PRODUCT.name}
金额: ${PRODUCT.price}
联系方式: ${contact || '未填'}
时间: ${new Date().toLocaleString()}`);
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${msg}`);
  } catch(e) {
    console.log('通知发送失败');
  }
}
</script>
</body>
</html>
