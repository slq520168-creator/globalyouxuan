<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自助下单 - 数字产品</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            line-height: 1.5;
            padding-bottom: 110px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 22px 16px 30px;
            text-align: center;
        }
        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .container { max-width: 480px; margin: -18px auto 0; padding: 0 12px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title span {
            background: #667eea;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .product-list { display: flex; flex-direction: column; gap: 10px; }
        .product-item {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-item:active { transform: scale(0.98); }
        .product-item.active {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .product-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .product-info p { font-size: 12px; color: #888; }
        .product-price { font-size: 18px; font-weight: 700; color: #e74c3c; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #667eea;
            background: white;
        }
        .form-group textarea { resize: none; height: 80px; }
        .payment-box {
            background: #f8f9ff;
            border: 1.5px dashed #667eea;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .payment-box .amount {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin: 8px 0;
        }
        .payment-box .address {
            background: white;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            word-break: break-all;
            margin: 10px 0;
            border: 1px solid #e0e5ff;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            margin-top: 8px;
            cursor: pointer;
        }
        .tips {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            line-height: 1.7;
            text-align: left;
        }
        .tips li {
            margin-bottom: 4px;
            list-style: none;
            position: relative;
            padding-left: 14px;
        }
        .tips li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .submit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 100;
        }
        .submit-btn {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .modal-content .icon { font-size: 48px; margin-bottom: 12px; }
        .modal-content h2 { font-size: 18px; margin-bottom: 8px; }
        .modal-content p { font-size: 14px; color: #666; margin-bottom: 6px; }
        .order-no {
            background: #f0f3ff;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            color: #667eea;
            margin: 12px 0;
            font-size: 15px;
        }
        .modal-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 15px;
            margin-top: 16px;
            cursor: pointer;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #667eea;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>数字产品自助下单</h1>
        <p>支付后自动通知 · 极速发货</p>
    </div>

    <div class="container">
        <!-- 选择商品 -->
        <div class="card">
            <div class="card-title"><span>1</span> 选择商品</div>
            <div class="product-list" id="productList"></div>
        </div>

        <!-- 填写信息 -->
        <div class="card">
            <div class="card-title"><span>2</span> 填写信息</div>
            <div class="form-group">
                <label>联系方式（邮箱 / Telegram / 微信号）</label>
                <input type="text" id="contact" placeholder="请填写接收数字产品的联系方式" required>
            </div>
            <div class="form-group">
                <label>备注（选填）</label>
                <textarea id="remark" placeholder="如有特殊要求请在此说明"></textarea>
            </div>
        </div>

        <!-- 支付信息 -->
        <div class="card">
            <div class="card-title"><span>3</span> 支付信息</div>
            <div class="payment-box">
                <div style="font-size:13px;color:#666;">应付金额（USDT-TRC20）</div>
                <div class="amount" id="payAmount">¥0.00</div>
                <div style="font-size:13px;color:#666;margin-bottom:6px;">收款地址</div>
                <div class="address" id="usdtAddress">TKfQoN7kZirALGYxMkxU4SoqMWJRqXsh7k</div>
                <button class="copy-btn" onclick="copyAddress()">复制地址</button>
                <ul class="tips">
                    <li>请使用 <strong>USDT-TRC20</strong> 网络转账，其他网络无法到账</li>
                    <li>转账金额请与应付金额完全一致</li>
                    <li>支付完成后请点击下方「我已支付」提交订单</li>
                    <li>系统会立即通知商家，确认后自动发货</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="submit-bar">
        <div class="loading" id="loading">正在提交订单...</div>
        <button class="submit-btn" id="submitBtn" onclick="submitOrder()">我已支付，提交订单</button>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="icon">✅</div>
            <h2>订单提交成功</h2>
            <p>已通知商家，请耐心等待确认</p>
            <div class="order-no" id="orderNoDisplay">订单号：</div>
            <p style="font-size:13px;">发货后会通知到您填写的联系方式<br>请保持畅通</p>
            <button class="modal-btn" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <script>
        // ==================== 配置（已填好，无需修改） ====================
        const BOT_TOKEN = "8835320602:AAGCrOvqcmBcYIFctpTAba3ZcPw3a7GU8aQ";
        const CHAT_ID = "6934078288";
        const USDT_ADDRESS = "TKfQoN7kZirALGYxMkxU4SoqMWJRqXsh7k";

        const products = [
            { id: 1, name: "基础版数字答案", desc: "单次交付 · 即时发货", price: 9.9 },
            { id: 2, name: "高级版数字答案", desc: "含详细解析 + 扩展资料", price: 19.9 },
            { id: 3, name: "旗舰全套资料包", desc: "全套资源 + 终身更新", price: 39.9 }
        ];
        // ================================================================

        let selectedProduct = null;

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = products.map(p => `
                <div class="product-item" data-id="${p.id}" onclick="selectProduct(${p.id})">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div class="product-price">¥${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        function selectProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            document.querySelectorAll('.product-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === id);
            });
            document.getElementById('payAmount').textContent = '¥' + selectedProduct.price.toFixed(2);
        }

        function copyAddress() {
            navigator.clipboard.writeText(USDT_ADDRESS).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制地址', 1500);
            }).catch(() => {
                alert('复制失败，请长按地址手动复制');
            });
        }

        function generateOrderNo() {
            const now = new Date();
            const date = now.getFullYear().toString().slice(2) +
                         String(now.getMonth() + 1).padStart(2, '0') +
                         String(now.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 900000 + 100000);
            return 'ORD' + date + random;
        }

        async function sendTelegramNotify(order) {
            const text = `🔔 新订单通知

订单号：${order.orderNo}
商品：${order.productName}
金额：¥${order.price.toFixed(2)} USDT
联系方式：${order.contact}
备注：${order.remark || '无'}
时间：${order.createTime}

请尽快核对到账并安排发货。`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            });
            return res.ok;
        }

        async function submitOrder() {
            if (!selectedProduct) {
                alert('请先选择商品');
                return;
            }
            const contact = document.getElementById('contact').value.trim();
            if (!contact) {
                alert('请填写联系方式');
                document.getElementById('contact').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.style.display = 'block';

            const orderNo = generateOrderNo();
            const remark = document.getElementById('remark').value.trim();
            const now = new Date();
            const createTime = now.toLocaleString('zh-CN', { hour12: false });

            const order = {
                orderNo,
                productName: selectedProduct.name,
                price: selectedProduct.price,
                contact,
                remark,
                createTime
            };

            try {
                // 发送Telegram通知
                const success = await sendTelegramNotify(order);

                // 本地也存一份（方便你自己查看）
                let orders = JSON.parse(localStorage.getItem('orders') || '[]');
                orders.unshift(order);
                localStorage.setItem('orders', JSON.stringify(orders));

                // 显示成功
                document.getElementById('orderNoDisplay').textContent = '订单号：' + orderNo;
                document.getElementById('successModal').classList.add('show');

                if (!success) {
                    console.warn('Telegram通知可能发送失败，请检查Bot权限');
                }
            } catch (err) {
                console.error(err);
                alert('提交失败，请检查网络后重试');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            document.getElementById('contact').value = '';
            document.getElementById('remark').value = '';
            selectedProduct = null;
            document.querySelectorAll('.product-item').forEach(el => el.classList.remove('active'));
            document.getElementById('payAmount').textContent = '¥0.00';
        }

        // 初始化
        document.getElementById('usdtAddress').textContent = USDT_ADDRESS;
        renderProducts();
        if (products.length > 0) selectProduct(products[0].id);
    </script>
</body>
</html>
