<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>下单 - GlobalYouXuan</title>
<link rel="stylesheet" href="style.css">
<style>
.order-page{max-width:480px;margin:0 auto;padding:20px 16px 60px}
.order-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.order-card h1{font-size:22px;margin:0 0 8px}
.price{font-size:28px;font-weight:800;color:var(--blue);margin:8px 0 20px}
.price small{font-size:14px;font-weight:500;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:0}
.pay-methods{display:grid;gap:12px;margin:20px 0}
.pay-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);cursor:pointer}
.pay-item.active{border-color:var(--blue)}
.pay-item h3{margin:0 0 4px;font-size:15px}
.pay-item p{margin:0;font-size:13px;color:var(--muted)}
.addr-box{display:flex;gap:8px;margin-top:10px;align-items:center}
.addr-box code{flex:1;font-size:12px;word-break:break-all;background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--line)}
.copy-btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pay-btn{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;color:#fff}
.btn-main{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;margin-top:8px}
.status-box{text-align:center;padding:24px 16px}
.back{display:inline-block;margin-bottom:16px;color:var(--blue);font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.order-id{font-size:22px;font-weight:700;margin:12px 0;letter-spacing:1px;color:var(--blue)}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name">GlobalYouXuan</span></a>
</header>
<div class="order-page">
  <a class="back" href="javascript:history.back()">← 返回</a>
  <div class="order-card" id="orderForm">
    <h1 id="productName">加载中...</h1>
    <div class="price"><span id="productPrice">--</span> <small>USDT</small></div>
    <div class="field">
      <label>联系方式（选填）</label>
      <input id="contact" placeholder="Telegram / 微信 / 邮箱" />
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <input id="note" placeholder="其他说明" />
    </div>
    <div class="pay-methods">
      <div class="pay-item active" data-pay="usdt" onclick="selectPay(this)">
        <h3>① U收款（推荐）</h3>
        <p>USDT · 一键复制</p>
        <div class="addr-box">
          <code id="usdtAddr">TKfQoN7kZirALGYxMkxU4SoqMWJRqXsh7k</code>
          <button class="copy-btn" type="button" onclick="copyAddr(event)">复制</button>
        </div>
      </div>
      <div class="pay-item" data-pay="alipay" onclick="selectPay(this)">
        <h3>② 支付宝</h3>
        <p>点击获取收款信息</p>
        <a class="pay-btn" href="tg://resolve?domain=qqyousubot" style="background:#1677ff;">获取支付宝</a>
      </div>
      <div class="pay-item" data-pay="wechat" onclick="selectPay(this)">
        <h3>③ 微信</h3>
        <p>点击获取收款信息</p>
        <a class="pay-btn" href="tg://resolve?domain=qqyousubot" style="background:#07c160;">获取微信</a>
      </div>
    </div>
    <button class="btn-main" onclick="submitPaid()">我已付款，请确认</button>
    <p class="note">请先转账再点击。确认到账后即可用订单号下载。</p>
  </div>
  <div class="order-card status-box" id="resultBox" style="display:none">
    <h2>✅ 订单已提交</h2>
    <p>请保存你的订单号：</p>
    <div class="order-id" id="orderIdShow"></div>
    <p class="note">客服确认到账后，打开「查询下载」页面，输入订单号即可下载。</p>
    <p style="margin-top:16px">
      <a href="query.html" style="color:var(--blue);font-weight:600">去下载 →</a>
    </p>
  </div>
</div>
<script>
// ============================================================
// 配置（改成你自己的）
// ============================================================
const SUPABASE_URL = 'https://bpbstpwwpprzduoppox.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwYnN0cHd3cHByemR1b3Bwb3giLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc1Mjg2MTE4NCwiZXhwIjoyMDY4NDM3MTg0fQ.9JmCQoP7R5K8m3xVnqT6WgLrFh2YbZ4NcD1eU5fJ8oA';

const BOT_TOKEN = '8835320602:AAGCrOvqcmBcYIFctpTAba3ZcPw3a7GU8aQ';
const CHAT_ID = '6934078288';

// ============================================================
const params = new URLSearchParams(location.search);
const PRODUCT = {
  name: params.get('name') || '未指定产品',
  price: params.get('price') || '0U'
};

document.getElementById('productName').textContent = PRODUCT.name;
document.getElementById('productPrice').textContent = PRODUCT.price.replace('U','');

function selectPay(el){
  document.querySelectorAll('.pay-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
}

function copyAddr(e){
  e.stopPropagation();
  navigator.clipboard.writeText(document.getElementById('usdtAddr').textContent).then(()=>{
    e.target.textContent='已复制';
    setTimeout(()=>e.target.textContent='复制',1500);
  });
}

function genOrderId(){
  const n = Date.now().toString().slice(-4);
  return 'YX' + n;
}

function genPwd(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)];
  return s;
}

async function submitPaid(){
  const contact = document.getElementById('contact').value.trim();
  const note = document.getElementById('note').value.trim();
  const payType = document.querySelector('.pay-item.active')?.dataset.pay || 'usdt';
  const orderId = genOrderId();
  const pwd = genPwd();

  // 获取当前用户ID（如果已登录）
  let userId = null;
  try {
    const session = JSON.parse(localStorage.getItem('supabase_session') || 'null');
    if (session && session.user) {
      userId = session.user.id;
    }
  } catch(e) {}

  // 写入 Supabase orders 表
  try {
    const response = await fetch(SUPABASE_URL + '/rest/v1/orders', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({
        user_id: userId,
        plan_name: PRODUCT.name,
        plan_price: PRODUCT.price,
        download_url: 'https://slq520168-creator.github.io/globalyouxuan/answers/' + encodeURIComponent(PRODUCT.name) + '.txt',
        status: 'pending'
      })
    });
    if (!response.ok) {
      console.error('Supabase写入失败:', await response.text());
    }
  } catch(e) {
    console.error('写入订单错误:', e);
  }

  // 发送 Telegram 通知
  const orderText = encodeURIComponent(`🛒 待确认订单
订单号: ${orderId}
产品: ${PRODUCT.name}
金额: ${PRODUCT.price}
付款方式: ${payType}
联系方式: ${contact||'未填'}
备注: ${note||'无'}
下载密码: ${pwd}
时间: ${new Date().toLocaleString()}`);

  const jsonText = encodeURIComponent(`确认到账后，复制下面整行加入 confirmed.json：

{"id":"${orderId}","pwd":"${pwd}","product":"${PRODUCT.name}"}`);

  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${orderText}`);
    await new Promise(r => setTimeout(r, 600));
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${jsonText}`);
  } catch(e) {}

  document.getElementById('orderForm').style.display = 'none';
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('orderIdShow').textContent = orderId;
}
</script>
</body>
</html>
