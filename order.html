<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自助下单 - 数字产品</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            line-height: 1.5;
            padding-bottom: 100px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 16px 28px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .container {
            max-width: 480px;
            margin: -16px auto 0;
            padding: 0 12px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title span {
            background: #667eea;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-item {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-item:active {
            transform: scale(0.98);
        }
        .product-item.active {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .product-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .product-info p {
            font-size: 12px;
            color: #888;
        }
        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #e74c3c;
        }
        .product-price small {
            font-size: 12px;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #667eea;
            background: white;
        }
        .form-group textarea {
            resize: none;
            height: 80px;
        }
        .payment-box {
            background: #f8f9ff;
            border: 1.5px dashed #667eea;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .payment-box .amount {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin: 8px 0;
        }
        .payment-box .address {
            background: white;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            word-break: break-all;
            margin: 10px 0;
            border: 1px solid #e0e5ff;
            position: relative;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            margin-top: 8px;
            cursor: pointer;
        }
        .tips {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            line-height: 1.6;
            text-align: left;
        }
        .tips li {
            margin-bottom: 4px;
            list-style: none;
            position: relative;
            padding-left: 14px;
        }
        .tips li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .submit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 100;
        }
        .submit-btn {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:active {
            opacity: 0.9;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        /* 成功弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .modal-content .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .modal-content p {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        .order-no {
            background: #f0f3ff;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            color: #667eea;
            margin: 12px 0;
            font-size: 15px;
        }
        .modal-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 15px;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>数字产品自助下单</h1>
        <p>支付后自动发货 · 7×24小时极速响应</p>
    </div>

    <div class="container">
        <!-- 选择商品 -->
        <div class="card">
            <div class="card-title"><span>1</span> 选择商品</div>
            <div class="product-list" id="productList">
                <!-- 商品由JS动态渲染 -->
            </div>
        </div>

        <!-- 填写信息 -->
        <div class="card">
            <div class="card-title"><span>2</span> 填写信息</div>
            <div class="form-group">
                <label>联系方式（邮箱 / Telegram / 微信号）</label>
                <input type="text" id="contact" placeholder="请填写接收数字产品的联系方式" required>
            </div>
            <div class="form-group">
                <label>备注（选填）</label>
                <textarea id="remark" placeholder="如有特殊要求请在此说明"></textarea>
            </div>
        </div>

        <!-- 支付信息 -->
        <div class="card">
            <div class="card-title"><span>3</span> 支付信息</div>
            <div class="payment-box">
                <div style="font-size:13px;color:#666;">应付金额（USDT-TRC20）</div>
                <div class="amount" id="payAmount">¥0.00</div>
                <div style="font-size:13px;color:#666;margin-bottom:6px;">收款地址</div>
                <div class="address" id="usdtAddress">
                    TXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                </div>
                <button class="copy-btn" onclick="copyAddress()">复制地址</button>
                <ul class="tips">
                    <li>请使用 <strong>USDT-TRC20</strong> 网络转账，其他网络无法到账</li>
                    <li>转账金额请与应付金额完全一致</li>
                    <li>支付完成后请点击下方「我已支付」提交订单</li>
                    <li>系统将在确认到账后自动发货到您的联系方式</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 底部提交栏 -->
    <div class="submit-bar">
        <button class="submit-btn" id="submitBtn" onclick="submitOrder()">我已支付，提交订单</button>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="icon">✅</div>
            <h2>订单提交成功</h2>
            <p>请耐心等待系统确认支付</p>
            <div class="order-no" id="orderNoDisplay">订单号：</div>
            <p style="font-size:13px;">发货后会通知到您填写的联系方式<br>请保持畅通</p>
            <button class="modal-btn" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <script>
        // ========== 配置区（可自行修改） ==========
        const products = [
            { id: 1, name: "基础版数字答案", desc: "单次交付 · 即时发货", price: 9.9 },
            { id: 2, name: "高级版数字答案", desc: "含详细解析 + 扩展资料", price: 19.9 },
            { id: 3, name: "旗舰全套资料包", desc: "全套资源 + 终身更新", price: 39.9 }
        ];

        // USDT-TRC20 收款地址（请替换成你自己的）
        const USDT_ADDRESS = "TKfQoN7kZirALGYxMkxU4SoqMWJRqXsh7k";

        // 提交订单后跳转的通知接口（可选，Telegram Bot 或自己的后端）
        // const NOTIFY_URL = "https://your-api.com/notify";
        // ========================================

        let selectedProduct = null;

        // 渲染商品列表
        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = products.map(p => `
                <div class="product-item" data-id="${p.id}" onclick="selectProduct(${p.id})">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div class="product-price">¥${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        // 选择商品
        function selectProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            document.querySelectorAll('.product-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === id);
            });
            document.getElementById('payAmount').textContent = '¥' + selectedProduct.price.toFixed(2);
        }

        // 复制地址
        function copyAddress() {
            const addr = document.getElementById('usdtAddress').textContent.trim();
            navigator.clipboard.writeText(addr).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制地址', 1500);
            }).catch(() => {
                alert('复制失败，请长按地址手动复制');
            });
        }

        // 生成订单号
        function generateOrderNo() {
            const now = new Date();
            const date = now.getFullYear().toString().slice(2) +
                         String(now.getMonth() + 1).padStart(2, '0') +
                         String(now.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 900000 + 100000);
            return 'ORD' + date + random;
        }

        // 提交订单
        function submitOrder() {
            if (!selectedProduct) {
                alert('请先选择商品');
                return;
            }
            const contact = document.getElementById('contact').value.trim();
            if (!contact) {
                alert('请填写联系方式');
                document.getElementById('contact').focus();
                return;
            }

            const orderNo = generateOrderNo();
            const remark = document.getElementById('remark').value.trim();

            // 本地存储订单（可替换为真实后端接口）
            const order = {
                orderNo,
                productId: selectedProduct.id,
                productName: selectedProduct.name,
                price: selectedProduct.price,
                contact,
                remark,
                status: 'pending',
                createTime: new Date().toISOString()
            };

            // 保存到 localStorage（演示用）
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // 显示成功弹窗
            document.getElementById('orderNoDisplay').textContent = '订单号：' + orderNo;
            document.getElementById('successModal').classList.add('show');

            // 可选：发送到后端或 Telegram 通知
            // fetch(NOTIFY_URL, {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(order)
            // });
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            // 重置表单
            document.getElementById('contact').value = '';
            document.getElementById('remark').value = '';
            selectedProduct = null;
            document.querySelectorAll('.product-item').forEach(el => el.classList.remove('active'));
            document.getElementById('payAmount').textContent = '¥0.00';
        }

        // 初始化
        document.getElementById('usdtAddress').textContent = USDT_ADDRESS;
        renderProducts();
        // 默认选中第一个商品
        if (products.length > 0) selectProduct(products[0].id);
    </script>
</body>
</html>
