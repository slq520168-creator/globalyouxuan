<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>查询下载 - GlobalYouXuan</title>
<link rel="stylesheet" href="style.css">
<style>
.box{max-width:420px;margin:0 auto;padding:40px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;box-shadow:var(--shadow);text-align:center}
h1{font-size:22px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);text-align:center;font-size:16px;margin-bottom:12px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.result{margin-top:20px;padding:16px;border-radius:12px;background:var(--bg);text-align:left}
.err{color:#ef4444;font-size:14px;text-align:center}
.ok{color:var(--cyan);font-size:14px;text-align:center;margin-bottom:12px}
.product-name{font-size:16px;font-weight:700;margin:8px 0;text-align:center}
.dl-btn{display:block;width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:700;text-align:center;text-decoration:none;margin-top:12px}
a.back{display:inline-block;margin-bottom:20px;color:var(--blue);font-size:14px}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name">GlobalYouXuan</span></a>
</header>
<div class="box">
  <a class="back" href="index.html">← 返回首页</a>
  <div class="card">
    <h1>查询并下载</h1>
    <p class="sub">输入订单号即可下载</p>
    <input id="oid" placeholder="订单号 例如 YX0001" />
    <button onclick="query()">查询下载</button>
    <div id="result" class="result" style="display:none"></div>
  </div>
</div>
<script>
const FILE_MAP = {
  "个人相册版": "xiangce.txt",
  "商户展示版": "shanghu.txt",
  "品牌官网版": "pinpai.txt",
  "企业系统版": "qiye.txt",
  "体验版": "zidonghua.txt",
  "小微自动化版": "xiaowei.txt",
  "团队协同版": "tuandui.txt",
  "企业定制版": "dingzhi.txt",
  "内容营销版": "neirong.txt",
  "企业办公版": "bangong.txt",
  "体验包": "tiyan.txt",
  "学习包": "xuexi.txt",
  "高手包": "gaoshou.txt",
  "私教定制": "sijiao.txt"
};

async function query(){
  const id = document.getElementById('oid').value.trim().toUpperCase();
  const box = document.getElementById('result');
  
  if(!id){
    box.style.display = 'block';
    box.innerHTML = '<p class="err">请输入订单号</p>';
    return;
  }

  try{
    const res = await fetch('confirmed.json?t=' + Date.now());
    const list = await res.json();
    const found = list.find(x => (x.id||'').toUpperCase() === id);
    
    box.style.display = 'block';
    
    if(found){
      const product = found.product || '';
      const file = FILE_MAP[product] || found.file || '';

      if(file){
        box.innerHTML = `
          <p class="ok">验证成功，可以下载</p>
          <div class="product-name">${product || '您的产品'}</div>
          <a class="dl-btn" href="${file}" download>立即下载</a>
        `;
      } else {
        box.innerHTML = `
          <p class="ok">验证成功</p>
          <p style="font-size:14px;color:var(--muted);text-align:center;margin-top:8px">文件准备中，请稍后再试</p>
        `;
      }
    } else {
      box.innerHTML = `
        <p class="err">订单号不存在或尚未确认</p>
        <p style="font-size:13px;color:var(--muted);margin-top:8px;text-align:center">请确认订单号是否正确，或稍后再试</p>
      `;
    }
  } catch(e){
    box.style.display = 'block';
    box.innerHTML = '<p class="err">查询失败，请稍后重试</p>';
  }
}
</script>
</body>
</html>
