<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>GlobalYouXuan｜全球优选数字化平台</title>
<meta name="description" content="GlobalYouXuan 全球数字化解决方案平台">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home">
    <span class="brand-mark">G</span>
    <span class="brand-name">GlobalYouXuan</span>
  </a>
  <div class="top-actions">
    <div class="lang-select">
      <button id="langBtn" class="lang-btn">中文 ▾</button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="zh">中文</button>
        <button data-lang="en">English</button>
        <button data-lang="km">ខ្មែរ</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1 data-i18n="heroTitle">连接全球智慧<br>驱动数字未来</h1>
      <p data-i18n="heroSub">助力企业与个人实现数字化升级</p>

      <form class="search-box" id="mainSearch">
        <span class="search-icon">✦</span>
        <input id="mainSearchInput" data-i18n-placeholder="searchPlaceholder" placeholder="AI 智能搜索，探索解决方案...">
        <button type="submit" aria-label="搜索">🔍</button>
      </form>

      <div class="entry-grid">
        <a class="entry-card c1" href="web.html">
          <div class="entry-icon">🖥️</div>
          <h3 data-i18n="card1">网站建设</h3>
        </a>
        <a class="entry-card c2" href="ai.html">
          <div class="entry-icon">🧠</div>
          <h3 data-i18n="card2">智控未来</h3>
        </a>
        <a class="entry-card c3" href="automation.html">
          <div class="entry-icon">📊</div>
          <h3 data-i18n="card3">量化感知</h3>
        </a>
        <a class="entry-card c4" href="digital.html">
          <div class="entry-icon">🎓</div>
          <h3 data-i18n="card4">数字学院</h3>
        </a>
      </div>
    </div>
  </section>

  <section class="match-section" id="match">
    <div class="section-inner">
      <h2 data-i18n="matchTitle">输入目标，生成方案</h2>
      <div class="match-box">
        <form class="search-box" id="matchSearch">
          <input id="matchInput" data-i18n-placeholder="matchPlaceholder" placeholder="例如：我要做跨境电商">
          <button type="submit" data-i18n="searchBtn">生成方案</button>
        </form>
        <div class="quick">
          <button data-q="网站建设">网站建设</button>
          <button data-q="AI">智控未来</button>
          <button data-q="订单">量化感知</button>
          <button data-q="数字">数字学院</button>
        </div>
        <div class="result-panel" id="resultPanel">
          <div class="result-empty">
            <span>AI</span>
            <p data-i18n="resultEmpty">输入目标后这里会显示匹配方案</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="contact-section" id="contact">
    <div class="section-inner contact-inner">
      <div>
        <h2 data-i18n="contactTitle">准备开始？</h2>
        <p data-i18n="contactSub">告诉我们你的目标，我们为你匹配执行路径</p>
        <div class="contact-ways">
          <a href="tg://resolve?domain=qqyousubot">@qqyousubot</a>
          <a href="mailto:slq520168@gmail.com">slq520168@gmail.com</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div><b>GlobalYouXuan</b></div>
  <small>© 2026 GlobalYouXuan</small>
</footer>

<script src="app.js"></script>
</body>
</html>
