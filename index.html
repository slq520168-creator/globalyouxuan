<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>GlobalYouXuan｜全球优选数字化平台</title>
<meta name="description" content="GlobalYouXuan 全球数字化解决方案平台">
<link rel="stylesheet" href="style.css">
<style>
.hero-content{width:min(100%,720px)}
#heroResult{margin-top:18px;text-align:left}
.qa-card{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 16px;
  box-shadow:0 10px 30px rgba(15,23,42,.06);
  animation:fadeUp .25s ease;
}
@media (prefers-color-scheme: dark){
  .qa-card{background:rgba(17,24,39,.92)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.qa-card h3{margin:0 0 14px;font-size:17px;line-height:1.4}
.qa-btn{
  width:100%;
  text-align:left;
  margin:0 0 10px;
  padding:14px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  color:var(--text);
  cursor:pointer;
  font-size:15px;
  font-weight:600;
}
.qa-btn:active{transform:scale(.99)}
.qa-actions{display:flex;gap:8px;margin-top:8px}
.qa-mini{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  cursor:pointer;
}
.plan-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.plan-item a{
  padding:8px 12px;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-size:12px;font-weight:700;text-decoration:none;
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home">
    <span class="brand-mark">G</span>
    <span class="brand-name">GlobalYouXuan</span>
  </a>
  <div class="top-actions">
    <div class="lang-select">
      <button id="langBtn" class="lang-btn">中文 ▾</button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="zh">中文</button>
        <button data-lang="en">English</button>
        <button data-lang="km">ខ្មែរ</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1 data-i18n="heroTitle">连接全球智慧<br>驱动数字未来</h1>
      <p data-i18n="heroSub">助力企业与个人实现数字化升级</p>

      <form class="search-box" id="mainSearch">
        <span class="search-icon">✦</span>
        <input id="mainSearchInput" data-i18n-placeholder="searchPlaceholder" placeholder="说说你现在最想解决的问题...">
        <button type="submit" aria-label="搜索">🔍</button>
      </form>

      <div id="heroResult"></div>

      <div class="entry-grid" id="entryGrid">
        <a class="entry-card c1" href="web.html"><div class="entry-icon">🖥️</div><h3 data-i18n="card1">网站建设</h3></a>
        <a class="entry-card c2" href="automation.html"><div class="entry-icon">🧠</div><h3 data-i18n="card2">智控未来</h3></a>
        <a class="entry-card c3" href="ai.html"><div class="entry-icon">📊</div><h3 data-i18n="card3">量化感知</h3></a>
        <a class="entry-card c4" href="digital.html"><div class="entry-icon">🎓</div><h3 data-i18n="card4">数字学院</h3></a>
      </div>
    </div>
  </section>

  <section class="contact-section" id="contact">
    <div class="section-inner contact-inner">
      <div>
        <h2 data-i18n="contactTitle">准备开始？</h2>
        <p data-i18n="contactSub">告诉我们你的目标，我们为你匹配执行路径</p>
        <div class="contact-ways">
          <a href="tg://resolve?domain=qqyousubot">@qqyousubot</a>
          <a href="mailto:slq520168@gmail.com">slq520168@gmail.com</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div><b>GlobalYouXuan</b></div>
  <small>© 2026 GlobalYouXuan</small>
</footer>

<script src="app.js"></script>
</body>
</html>
