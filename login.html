<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录/注册 - GlobalYouXuan</title>
<link rel="stylesheet" href="style.css">
<style>
.box{max-width:400px;margin:0 auto;padding:40px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0 0 8px;text-align:center}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;cursor:pointer;font-size:14px}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:transparent}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;margin-bottom:12px}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.msg{margin-top:12px;font-size:13px;text-align:center}
.err{color:#ef4444}
.ok{color:var(--cyan)}
a.back{display:inline-block;margin-bottom:20px;color:var(--blue);font-size:14px}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name">GlobalYouXuan</span></a>
</header>
<div class="box">
  <a class="back" href="index.html">← 返回首页</a>
  <div class="card">
    <h1 id="title">登录</h1>
    <p class="sub" id="sub">登录后下单更方便</p>
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabReg" onclick="switchTab('reg')">注册</div>
    </div>
    <input id="email" type="email" placeholder="邮箱" />
    <input id="password" type="password" placeholder="密码（至少6位）" />
    <button class="main" id="btn" onclick="submit()">登录</button>
    <div class="msg" id="msg"></div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://bpbstpwppprizduoppox.supabase.co';
const SUPABASE_KEY = 'sb_publishable_l3NVNYilYYqLFSWODvpLYw_sp9Bpefg';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = 'login';

function switchTab(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m = 'login');
  document.getElementById('tabReg').classList.toggle('active', m = 'reg');
  document.getElementById('title').textContent = m = 'login' ? '登录' : '注册';
  document.getElementById('sub').textContent = m = 'login' ? '登录后下单更方便' : '注册后可保存订单历史';
  document.getElementById('btn').textContent = m = 'login' ? '登录' : '注册';
  document.getElementById('msg').textContent = '';
}

async function submit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!email || !password) {
    msg.className = 'msg err';
    msg.textContent = '请填写邮箱和密码';
    return;
  }
  if (password.length < 6) {
    msg.className = 'msg err';
    msg.textContent = '密码至少6位';
    return;
  }

  msg.className = 'msg';
  msg.textContent = '处理中...';

  try {
    if (mode = 'reg') {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;
      msg.className = 'msg ok';
      msg.textContent = '注册成功，请登录';
      switchTab('login');
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      msg.className = 'msg ok';
      msg.textContent = '登录成功，正在跳转...';
      setTimeout(() => location.href = 'index.html', 800);
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message || '操作失败，请重试';
  }
}
</script>


</body>
</html>
