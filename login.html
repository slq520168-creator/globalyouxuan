<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 - GlobalYouXuan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:#fff;border-radius:20px;padding:40px 28px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.login-box h1{font-size:24px;margin-bottom:6px}
.login-box .sub{color:#888;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.form-group input{width:100%;padding:13px 16px;border:2px solid #e8ecf1;border-radius:12px;font-size:15px;outline:none}
.form-group input:focus{border-color:#667eea}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary:disabled{opacity:.6}
.error-msg,.success-msg{font-size:13px;margin-top:10px;display:none;text-align:center}
.error-msg{color:#d32f2f}
.success-msg{color:#2e7d32}
.toggle-link{text-align:center;margin-top:18px;font-size:14px;color:#888}
.toggle-link a{color:#667eea;text-decoration:none;font-weight:600}
.back-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:#999;text-decoration:none}
</style>
</head>
<body>
<div class="login-box">
  <h1 id="formTitle">👋 欢迎回来</h1>
  <p class="sub" id="formSub">登录后查看你的方案和订单</p>
  <form id="authForm">
    <div class="form-group" id="nameGroup" style="display:none">
      <label>昵称</label>
      <input type="text" id="fullName" placeholder="你的昵称">
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="请输入邮箱" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="至少6位" required minlength="6">
    </div>
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    <button type="submit" class="btn-primary" id="submitBtn">登录</button>
  </form>
  <div class="toggle-link">
    <span id="toggleText">还没有账号？</span>
    <a href="#" id="toggleLink">立即注册</a>
  </div>
  <a href="index.html" class="back-link">← 返回首页</a>
</div>

<script>
const SUPABASE_URL = 'https://afzcohtnljnmucrkgcaz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EqF-kTNRsSZWhUE8LWB8DQ_UNkTjImv';

const form = document.getElementById('authForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const fullNameInput = document.getElementById('fullName');
const nameGroup = document.getElementById('nameGroup');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const toggleLink = document.getElementById('toggleLink');
const toggleText = document.getElementById('toggleText');
const formTitle = document.getElementById('formTitle');
const formSub = document.getElementById('formSub');

let isLoginMode = true;

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  successMsg.style.display = 'none';
}
function showSuccess(msg) {
  successMsg.textContent = msg;
  successMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

function toggleMode() {
  isLoginMode = !isLoginMode;
  if (isLoginMode) {
    formTitle.textContent = '👋 欢迎回来';
    formSub.textContent = '登录后查看你的方案和订单';
    submitBtn.textContent = '登录';
    toggleText.textContent = '还没有账号？';
    toggleLink.textContent = '立即注册';
    nameGroup.style.display = 'none';
  } else {
    formTitle.textContent = '✨ 注册新账号';
    formSub.textContent = '注册后即可购买方案，开始赚钱';
    submitBtn.textContent = '注册';
    toggleText.textContent = '已有账号？';
    toggleLink.textContent = '去登录';
    nameGroup.style.display = 'block';
  }
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
}

toggleLink.addEventListener('click', e => {
  e.preventDefault();
  toggleMode();
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const fullName = fullNameInput.value.trim();

  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = isLoginMode ? '登录中...' : '注册中...';

  try {
    let data;
    if (isLoginMode) {
      // 登录
      const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY
        },
        body: JSON.stringify({ email, password })
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || data.message || '登录失败');
    } else {
      // 注册
      if (!fullName) throw new Error('请输入昵称');
      const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY
        },
        body: JSON.stringify({
          email,
          password,
          data: { full_name: fullName }
        })
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || data.message || '注册失败');
    }

    // 保存 session
    localStorage.setItem('supabase_session', JSON.stringify({
      user: data.user || data,
      access_token: data.access_token,
      refresh_token: data.refresh_token
    }));

    showSuccess(isLoginMode ? '✅ 登录成功，正在跳转...' : '✅ 注册成功，正在跳转...');
    setTimeout(() => location.href = 'member.html', 900);

  } catch (err) {
    showError(err.message || '网络错误，请重试');
    submitBtn.disabled = false;
    submitBtn.textContent = isLoginMode ? '登录' : '注册';
  }
});
</script>
</body>
</html>
