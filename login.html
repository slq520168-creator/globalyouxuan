<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GlobalYouXuan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-box h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .login-box .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .toggle-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #888;
        }
        .toggle-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .success-msg {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #999;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1 id="formTitle">👋 欢迎回来</h1>
    <p class="sub" id="formSub">登录后查看你的方案和订单</p>

    <form id="authForm">
        <div class="form-group" id="nameGroup" style="display:none;">
            <label>昵称</label>
            <input type="text" id="fullName" placeholder="你的昵称">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="至少6位" required minlength="6">
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        <button type="submit" class="btn-primary" id="submitBtn">登录</button>
    </form>

    <div class="toggle-link">
        <span id="toggleText">还没有账号？</span>
        <a href="#" id="toggleLink">立即注册</a>
    </div>

    <a href="index.html" class="back-link">← 返回首页</a>
</div>

<script>
    // ============================================================
    // Supabase 配置（替换成你自己的）
    // ============================================================
    const SUPABASE_URL = 'https://你的项目ID.supabase.co';
    const SUPABASE_KEY = '你的anon公钥';

    // ============================================================
    // 状态
    // ============================================================
    let isLoginMode = true;

    // ============================================================
    // DOM 引用
    // ============================================================
    const form = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const nameGroup = document.getElementById('nameGroup');
    const fullNameInput = document.getElementById('fullName');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const toggleLink = document.getElementById('toggleLink');
    const toggleText = document.getElementById('toggleText');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');

    // ============================================================
    // Supabase 客户端（简化版，模拟真实登录）
    // ============================================================
    const supabase = {
        auth: {
            signUp: async ({ email, password, options }) => {
                // 模拟注册：保存到 localStorage
                const users = JSON.parse(localStorage.getItem('supabase_users') || '[]');
                const existing = users.find(u => u.email === email);
                if (existing) {
                    return { data: null, error: { message: '该邮箱已被注册' } };
                }
                const newUser = {
                    id: 'user_' + Date.now(),
                    email: email,
                    password: password,
                    user_metadata: { full_name: options?.data?.full_name || '' },
                    created_at: new Date().toISOString()
                };
                users.push(newUser);
                localStorage.setItem('supabase_users', JSON.stringify(users));
                
                // 自动登录
                const session = { user: newUser };
                localStorage.setItem('supabase_session', JSON.stringify(session));
                
                return { data: { user: newUser, session }, error: null };
            },
            signInWithPassword: async ({ email, password }) => {
                const users = JSON.parse(localStorage.getItem('supabase_users') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                if (!user) {
                    return { data: null, error: { message: '邮箱或密码错误' } };
                }
                const session = { user: user };
                localStorage.setItem('supabase_session', JSON.stringify(session));
                return { data: { user, session }, error: null };
            }
        }
    };

    // ============================================================
    // 切换登录/注册
    // ============================================================
    function toggleMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            formTitle.textContent = '👋 欢迎回来';
            formSub.textContent = '登录后查看你的方案和订单';
            submitBtn.textContent = '登录';
            toggleText.textContent = '还没有账号？';
            toggleLink.textContent = '立即注册';
            nameGroup.style.display = 'none';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        } else {
            formTitle.textContent = '✨ 注册新账号';
            formSub.textContent = '注册后即可购买方案，开始赚钱';
            submitBtn.textContent = '注册';
            toggleText.textContent = '已有账号？';
            toggleLink.textContent = '去登录';
            nameGroup.style.display = 'block';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }
    }

    toggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        toggleMode();
    });

    // ============================================================
    // 表单提交
    // ============================================================
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const fullName = fullNameInput.value.trim();

        // 清空错误
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.textContent = isLoginMode ? '登录中...' : '注册中...';

        try {
            let result;
            if (isLoginMode) {
                result = await supabase.auth.signInWithPassword({ email, password });
            } else {
                if (!fullName) {
                    errorMsg.textContent = '请输入昵称';
                    errorMsg.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = isLoginMode ? '登录' : '注册';
                    return;
                }
                result = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName } }
                });
            }

            if (result.error) {
                errorMsg.textContent = result.error.message;
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? '登录' : '注册';
                return;
            }

            // 成功
            successMsg.textContent = isLoginMode ? '✅ 登录成功，正在跳转...' : '✅ 注册成功，正在跳转...';
            successMsg.classList.add('show');

            // 跳转到会员中心
            setTimeout(() => {
                window.location.href = 'member.html';
            }, 1000);

        } catch (err) {
            errorMsg.textContent = '网络错误，请重试';
            errorMsg.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = isLoginMode ? '登录' : '注册';
        }
    });
</script>

</body>
</html>
