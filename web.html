<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网站建设资源库 - GlobalYouXuan</title>
<link rel="stylesheet" href="style.css">
<style>
.res-page{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.res-header{margin-bottom:28px}
.res-header a{color:var(--blue);font-size:14px}
.res-header h1{font-size:26px;margin:12px 0 8px}
.res-header p{color:var(--muted);font-size:15px;margin:0}
.res-list{display:grid;gap:14px}
.res-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px
}
.res-card h3{margin:0;font-size:17px}
.res-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.res-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.res-price{font-weight:700;color:var(--blue);font-size:15px}
.res-price.free{color:var(--cyan)}
.res-btn{
  display:inline-block;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;text-align:center
}
.res-btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">G</span>
    <span class="brand-name">GlobalYouXuan</span>
  </a>
</header>

<div class="res-page">
  <div class="res-header">
    <a href="index.html">← 返回首页</a>
    <h1>网站建设资源库</h1>
    <p>企业官网、商城、落地页、多语言网站相关模板与源码</p>
  </div>

  <div class="res-list">
    <div class="res-card">
      <h3>企业展示官网模板</h3>
      <p>适合品牌展示、业务介绍、联系转化，手机端自适应。</p>
      <div class="res-meta">
        <span class="res-price">99 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>

    <div class="res-card">
      <h3>跨境商城基础版</h3>
      <p>商品展示、多语言、咨询下单链路，适合跨境业务起步。</p>
      <div class="res-meta">
        <span class="res-price">149 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>

    <div class="res-card">
      <h3>高转化落地页模板</h3>
      <p>单页销售落地页，突出卖点与行动按钮，适合投放测试。</p>
      <div class="res-meta">
        <span class="res-price">49 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>

    <div class="res-card">
      <h3>多语言网站框架</h3>
      <p>中英柬三语切换基础框架，可快速扩展业务页面。</p>
      <div class="res-meta">
        <span class="res-price free">免费</span>
        <a class="res-btn outline" href="#">查看说明</a>
      </div>
    </div>

    <div class="res-card">
      <h3>手机端官网模板</h3>
      <p>优先手机体验的轻量官网，加载快、结构清晰。</p>
      <div class="res-meta">
        <span class="res-price">79 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
