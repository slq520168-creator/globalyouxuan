<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智控未来资源库 - GlobalYouXuan</title>
<link rel="stylesheet" href="style.css">
<style>
.res-page{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.res-header{margin-bottom:28px}
.res-header a{color:var(--blue);font-size:14px}
.res-header h1{font-size:26px;margin:12px 0 8px}
.res-header p{color:var(--muted);font-size:15px;margin:0}
.res-list{display:grid;gap:14px}
.res-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.res-card h3{margin:0 0 6px;font-size:17px}
.res-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.res-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.res-price{font-weight:700;color:var(--blue);font-size:15px}
.res-price.free{color:var(--cyan)}
.res-btn{display:inline-block;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.res-btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">G</span><span class="brand-name">GlobalYouXuan</span></a>
</header>
<div class="res-page">
  <div class="res-header">
    <a href="index.html">← 返回首页</a>
    <h1>智控未来资源库</h1>
    <p>AI工具、提示词、客服方案、自动化能力</p>
  </div>
  <div class="res-list">
    <div class="res-card">
      <h3>三分钟玩转AI</h3>
      <p>快速上手 AI 写作、图片、对话的实用入门包。</p>
      <div class="res-meta">
        <span class="res-price">9.9 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>
    <div class="res-card">
      <h3>AI提示词精选库</h3>
      <p>覆盖写作、电商、客服、社媒等高频场景提示词。</p>
      <div class="res-meta">
        <span class="res-price">29 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>
    <div class="res-card">
      <h3>AI客服自动回复方案</h3>
      <p>常见问题库 + 自动回复逻辑，适合店铺和社群。</p>
      <div class="res-meta">
        <span class="res-price">49 U</span>
        <a class="res-btn" href="order.html">立即购买</a>
      </div>
    </div>
    <div class="res-card">
      <h3>免费AI工具导航</h3>
      <p>精选可用的免费AI工具清单与使用建议。</p>
      <div class="res-meta">
        <span class="res-price free">免费</span>
        <a class="res-btn outline" href="#">查看</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
